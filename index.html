<script>
  // Load required libraries with fallback CDN sources — some networks/firewalls
  // block one CDN provider but allow another. Shows a clear message if all fail.
  window.__appBooted = false;

  // Install prompt (Android/Chrome) — captured early so it's ready whenever the app shows the button.
  window.__deferredInstallPrompt = null;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    window.__deferredInstallPrompt = e;
    window.dispatchEvent(new Event("pi-install-available"));
  });
  window.addEventListener("appinstalled", () => {
    window.__deferredInstallPrompt = null;
  });

  // Service worker for offline caching + installability
  if("serviceWorker" in navigator){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }

  function showLoadError(msg){
    var root = document.getElementById('root');
    if(root){
      root.innerHTML = '<div style="padding:40px 24px;text-align:center;font-family:sans-serif;color:#C43B3B;">' + msg + '<br>Check your internet connection and reload.<br><br><button onclick="window.location.reload()" style="margin-top:14px;padding:10px 22px;border-radius:8px;border:1.5px solid #C43B3B;background:#fff;color:#C43B3B;font-weight:700;">Reload</button></div>';
    }
  }
  function loadScriptChain(urls, onDone, onAllFailed){
    var i = 0;
    function tryNext(){
      if(i >= urls.length){ onAllFailed(); return; }
      var s = document.createElement('script');
      s.src = urls[i];
      s.onload = onDone;
      s.onerror = function(){ i++; tryNext(); };
      document.head.appendChild(s);
    }
    tryNext();
  }
  var __loaded = { supabase: false, jspdf: false, autotable: false, xlsx: false, html2canvas: false };
  function __checkAllLoaded(){
    if(__loaded.supabase && __loaded.jspdf && __loaded.autotable && __loaded.xlsx && __loaded.html2canvas){
      window.__librariesAlreadyReady = true;
      var evt = document.createEvent('Event');
      evt.initEvent('librariesReady', true, true);
      document.dispatchEvent(evt);
    }
  }
  loadScriptChain([
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",
    "https://unpkg.com/@supabase/supabase-js@2"
  ], function(){ __loaded.supabase = true; __checkAllLoaded(); }, function(){ showLoadError("Could not load the database library."); });

  loadScriptChain([
    "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
    "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"
  ], function(){ __loaded.jspdf = true; __checkAllLoaded(); }, function(){ showLoadError("Could not load the PDF library."); });

  loadScriptChain([
    "https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js",
    "https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"
  ], function(){ __loaded.autotable = true; __checkAllLoaded(); }, function(){ showLoadError("Could not load the PDF table library."); });

  loadScriptChain([
    "https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js",
    "https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"
  ], function(){ __loaded.xlsx = true; __checkAllLoaded(); }, function(){ showLoadError("Could not load the spreadsheet library."); });

  loadScriptChain([
    "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",
    "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
  ], function(){ __loaded.html2canvas = true; __checkAllLoaded(); }, function(){ showLoadError("Could not load the Arabic rendering library."); });

  setTimeout(function(){
    if(!window.__appBooted){
      showLoadError("This is taking longer than expected to load.");
    }
  }, 8000);
</script>

function projectName(id){
  const p = state.projects.find(x=>x.id===id);
  return p ? p.name : "";
}
function otOptions(selected){
  const values = [0, 0.5, 1, 1.5, 2, 3, 4, 5, 6, 7, 8];
  let opts = "";
  values.forEach(h=>{
    const val = h.toFixed(1);
    opts += `<option value="${val}" ${Number(selected)===h?"selected":""}>${h===0?"0":(Number.isInteger(h)?h:val)}</option>`;
  });
  return opts;
}
async function loadProjects(){
  const { data } = await sb.from("ts_projects").select("*").order("name");
  state.projects = data || [];  // includes inactive, so historical entries still resolve names
}
async function addProject(){
  const name = (state.newProjectName || "").trim();
  if(!name){ toast("Enter a project name."); return; }
  state.loading = true; render();
  const { error } = await sb.from("ts_projects").insert({ name });
  state.loading = false;
  if(error){
    toast(error.code === "23505" ? "A project with that name already exists." : "Could not add project.");
    render(); return;
  }
  state.newProjectName = "";
  toast("Project added.");
  await loadProjects();
  render();
}
async function deactivateProject(id){
  if(!confirm("Remove this project from the list? Past timesheet entries that used it are kept.")) return;
  state.loading = true; render();
  const { error } = await sb.from("ts_projects").update({ active: false }).eq("id", id);
  state.loading = false;
  toast(error ? "Could not remove project." : "Project removed.");
  await loadProjects();
  render();
}

function monthKey(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }
function monthLabel(d){ return d.toLocaleDateString("en-GB",{month:"long",year:"numeric"}); }
function daysInMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }
function pad(n){ return String(n).padStart(2,"0"); }
function fmtDate(y,m,day){ return `${y}-${pad(m+1)}-${pad(day)}`; }
function isFriday(y,m,day){ return new Date(y,m,day).getDay() === 5; }
function dayName(y,m,day){ return new Date(y,m,day).toLocaleDateString("en-GB",{weekday:"short"}); }
function dayNameFull(y,m,day){ return new Date(y,m,day).toLocaleDateString("en-GB",{weekday:"long"}); }

function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}

function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream; }
function isStandalone(){ return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true; }
function canShowInstallButton(){ return !isStandalone() && (window.__deferredInstallPrompt || isIOS()); }
async function handleInstallClick(){
  if(window.__deferredInstallPrompt){
    window.__deferredInstallPrompt.prompt();
    try{ await window.__deferredInstallPrompt.userChoice; }catch(e){}
    window.__deferredInstallPrompt = null;
    render();
  }else if(isIOS()){
    alert("To install: tap the Share button (square with an arrow) at the bottom of Safari, then choose \"Add to Home Screen\".");
  }
}

/* ---------------- login ---------------- */
async function doLogin(iqama){
  state.error = "";
  if(!iqama){ state.error = "Enter your Iqama / ID number."; render(); return; }
  const normalized = iqama.replace(/\D/g, ""); // keep digits only — ignores spaces/typos in formatting
  if(!normalized){ state.error = "Enter your Iqama / ID number."; render(); return; }
  state.loading = true; render();
  try{
    const { data, error } = await sb.from("ts_employees")
      .select("*")
      .eq("active", true);
    state.loading = false;
    if(error){
      state.error = "Connection problem — check your internet and try again.";
      render(); return;
    }
    const match = (data || []).find(row => (row.iqama_number || "").replace(/\D/g, "") === normalized);
    if(!match){
      state.error = "No match found. Check your Iqama / ID number, or contact your admin.";
      render(); return;
    }
    state.user = match;
    localStorage.setItem("ts_user", JSON.stringify(match));
    const mohammed = (data || []).find(row => (row.iqama_number || "") === "1091504728");
    state.hrmSupervisorId = mohammed ? mohammed.id : null;
    await loadProjects();
    state.view = match.role === "employee" ? "employee" : (match.role === "supervisor" ? "supervisor" : "hr");
    if(state.view === "employee") await loadEmployeeMonth();
    if(state.view === "supervisor") await loadSupervisorList();
    if(state.view === "hr") await loadHrMonth();
    render();
  }catch(e){
    state.loading = false;
    state.error = "Connection problem — check your internet and try again.";
    render();
  }
}

function logout(){
  localStorage.removeItem("ts_user");
  state = { ...state, user:null, view:"login", entries:{}, submission:null, error:"" };
  render();
}

/* ---------------- employee flow ---------------- */
async function loadEmployeeMonth(){
  state.loading = true; render();
  const mk = monthKey(state.monthDate);
  const y = state.monthDate.getFullYear(), m = state.monthDate.getMonth();
  const nd = daysInMonth(state.monthDate);
  const start = fmtDate(y,m,1), end = fmtDate(y,m,nd);

  const [{data: entryRows}, {data: sub}] = await Promise.all([
    sb.from("ts_timesheet_entries").select("*").eq("employee_id", state.user.id).gte("entry_date", start).lte("entry_date", end),
    sb.from("ts_timesheet_submissions").select("*").eq("employee_id", state.user.id).eq("month", mk).maybeSingle(),
    loadProjects() // always refresh so newly-added projects show up without needing to re-login
  ]);

  const entries = {};
  for(let day=1; day<=nd; day++){
    const dstr = fmtDate(y,m,day);
    const existing = (entryRows||[]).find(r=>r.entry_date===dstr);
    entries[dstr] = existing
      ? { status: existing.status, overtime_hours: existing.overtime_hours, project_id: existing.project_id || "" }
      : { status: isFriday(y,m,day) ? "Friday" : "Present", overtime_hours: 0, project_id: "" };
  }
  state.entries = entries;
  state.submission = sub || null;
  state.remarksDraft = (sub && sub.remarks) || "";
  state.loading = false;
  render();
}

function setEntry(dstr, field, value){
  if(!state.entries[dstr]) return;
  state.entries[dstr][field] = value;
  renderMain();
}

async function saveDraft(silent){
  state.loading = true; render();
  const mk = monthKey(state.monthDate);
  const rows = Object.entries(state.entries).map(([dstr, v]) => ({
    employee_id: state.user.id,
    month: mk,
    entry_date: dstr,
    status: v.status,
    overtime_hours: Number(v.overtime_hours) || 0,
    project_id: v.project_id || null,
    updated_at: new Date().toISOString()
  }));

function computeTotals(entries){
  let present=0, absent=0, sick=0, leave=0, friday=0, ot=0;
  Object.values(entries).forEach(v=>{
    if(v.status==="Present") present++;
    else if(v.status==="Absent") absent++;
    else if(v.status==="Sick") sick++;
    else if(v.status==="Leave") leave++;
    else friday++;
    ot += Number(v.overtime_hours)||0;
  });
  return { present, absent, sick, leave, friday, ot, regularHours: present*8, totalHours: present*8+ot };
}

/* signature pad */
let sigCtx=null, sigDrawing=false, sigHasStroke=false;
function initSigPad(){
  const canvas = document.getElementById("sigCanvas");
  if(!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * ratio;
  canvas.height = canvas.clientHeight * ratio;
  sigCtx = canvas.getContext("2d");
  sigCtx.scale(ratio, ratio);
  sigCtx.lineWidth = 2.2;
  sigCtx.lineCap = "round";
  sigCtx.strokeStyle = "#0F3556";
  sigHasStroke = false;

  const pos = (e)=>{
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - r.left, y: p.clientY - r.top };
  };
  const start = (e)=>{ e.preventDefault(); sigDrawing=true; const p=pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x,p.y); };
  const move = (e)=>{ if(!sigDrawing) return; e.preventDefault(); const p=pos(e); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); sigHasStroke=true; };
  const end = ()=>{ sigDrawing=false; };

  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start, {passive:false});
  canvas.addEventListener("touchmove", move, {passive:false});
  canvas.addEventListener("touchend", end);
}
function clearSigPad(){
  const canvas = document.getElementById("sigCanvas");
  if(canvas && sigCtx){ sigCtx.clearRect(0,0,canvas.width,canvas.height); sigHasStroke=false; }
}
async function saveSigPad(){
  const canvas = document.getElementById("sigCanvas");
  if(!canvas || !sigHasStroke){ toast("Draw your signature first."); return; }
  const dataUrl = canvas.toDataURL("image/png");
  state.loading = true; render();
  const { error } = await sb.from("ts_supervisor_signatures").upsert({
    supervisor_id: state.user.id, signature_data: dataUrl, updated_at: new Date().toISOString()
  }, { onConflict: "supervisor_id" });
  state.loading = false;
  state.savedSignature = dataUrl;
  toast(error ? "Could not save signature." : "Signature saved.");
  render();
}

function formatDateDMY(dateStr){
  if(!dateStr) return "-";
  const parts = String(dateStr).split("-");
  if(parts.length !== 3) return dateStr;
  const [y, m, d] = parts;
  return `${d}-${m}-${y}`;
}

function leaveDaysBetween(firstDay, lastDay){
  if(!firstDay || !lastDay) return 0;
  const a = new Date(firstDay), b = new Date(lastDay);
  const diff = Math.round((b - a) / 86400000) + 1;
  return diff > 0 ? diff : 0;
}

function humanDuration(fromStr, toStr){
  if(!fromStr) return null;
  const from = new Date(fromStr);
  const to = toStr ? new Date(toStr) : new Date();
  let months = (to.getFullYear() - from.getFullYear()) * 12 + (to.getMonth() - from.getMonth());
  if(to.getDate() < from.getDate()) months--;
  if(months <= 0){
    const days = Math.round((to - from) / 86400000);
    return days <= 0 ? "Today" : `${days} day${days===1?"":"s"} before`;
  }
  if(months < 12) return `${months} month${months===1?"":"s"} before`;
  const years = Math.floor(months/12), remMonths = months % 12;
  return (remMonths > 0 ? `${years} year${years===1?"":"s"} ${remMonths} month${remMonths===1?"":"s"}` : `${years} year${years===1?"":"s"}`) + " before";
}

function handleLeavePhotoFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const SIZE = 300;
      // Square crop (for the on-screen preview, shown circular via CSS)
      const squareCanvas = document.createElement("canvas");
      squareCanvas.width = SIZE; squareCanvas.height = SIZE;
      const sctx = squareCanvas.getContext("2d");
      const side = Math.min(img.width, img.height);
      const sx = (img.width - side) / 2, sy = (img.height - side) / 2;
      sctx.drawImage(img, sx, sy, side, side, 0, 0, SIZE, SIZE);
      state.leaveFormDraft.photoDataUrl = squareCanvas.toDataURL("image/jpeg", 0.85);

      // Circular PNG with transparent corners (for the PDF — avoids relying on jsPDF's clip API)
      const circCanvas = document.createElement("canvas");
      circCanvas.width = SIZE; circCanvas.height = SIZE;
      const cctx = circCanvas.getContext("2d");
      cctx.save();
      cctx.beginPath();
      cctx.arc(SIZE/2, SIZE/2, SIZE/2, 0, Math.PI*2);
      cctx.closePath();
      cctx.clip();
      cctx.drawImage(img, sx, sy, side, side, 0, 0, SIZE, SIZE);
      cctx.restore();
      state.leaveFormDraft.photoCircleDataUrl = circCanvas.toDataURL("image/png");

      render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

let leaveSigCtx=null, leaveSigDrawing=false, leaveSigHasStroke=false;
function initLeaveSigPad(){
  const canvas = document.getElementById("leaveSigCanvas");
  if(!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * ratio;
  canvas.height = canvas.clientHeight * ratio;
  leaveSigCtx = canvas.getContext("2d");
  leaveSigCtx.scale(ratio, ratio);
  leaveSigCtx.lineWidth = 2.2;
  leaveSigCtx.lineCap = "round";
  leaveSigCtx.strokeStyle = "#0F3556";
  leaveSigHasStroke = false;

  // If editing an existing application, show their prior signature as a starting point —
  // they can leave it as-is (submit works without redrawing) or clear and re-sign.
  if(state.leaveFormDraft.existingSignature){
    const img = new Image();
    img.onload = () => { leaveSigCtx.drawImage(img, 0, 0, canvas.clientWidth, canvas.clientHeight); };
    img.src = state.leaveFormDraft.existingSignature;
  }

  const pos = (e)=>{
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - r.left, y: p.clientY - r.top };
  };
  const start = (e)=>{ e.preventDefault(); leaveSigDrawing=true; const p=pos(e); leaveSigCtx.beginPath(); leaveSigCtx.moveTo(p.x,p.y); };
  const move = (e)=>{ if(!leaveSigDrawing) return; e.preventDefault(); const p=pos(e); leaveSigCtx.lineTo(p.x,p.y); leaveSigCtx.stroke(); leaveSigHasStroke=true; };
  const end = ()=>{ leaveSigDrawing=false; };

  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start, {passive:false});
  canvas.addEventListener("touchmove", move, {passive:false});
  canvas.addEventListener("touchend", end);
}
function clearLeaveSigPad(){
  const canvas = document.getElementById("leaveSigCanvas");
  if(canvas && leaveSigCtx){ leaveSigCtx.clearRect(0,0,canvas.width,canvas.height); leaveSigHasStroke=false; }
}

function handlePurchasePhotoFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const MAXW = 700;
      const scale = Math.min(1, MAXW / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = img.width * scale; canvas.height = img.height * scale;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      state.purchaseFormDraft.receiptPhoto = canvas.toDataURL("image/jpeg", 0.8);
      render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        // Compress before sending — a raw camera photo can be several MB, which
        // makes the AI request slow or unresponsive. Match the same size used
        // when saving the receipt photo, so scanning stays fast either way.
        const MAXW = 1000;
        const scale = Math.min(1, MAXW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale; canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.8);
        resolve({ base64: dataUrl.slice(dataUrl.indexOf(",") + 1), mediaType: "image/jpeg" });
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function tryAiScanBill(file){
  const { base64, mediaType } = await fileToBase64(file);
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 30000);
  let resp;
  try{
    resp = await fetch(`${SUPABASE_URL}/functions/v1/smart-endpoint`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ imageBase64: base64, mediaType }),
      signal: controller.signal
    });
  }catch(e){
    if(e.name === "AbortError") throw new Error("Scan timed out after 30 seconds — try again with a clearer photo.");
    throw e;
  }finally{
    clearTimeout(timeoutId);
  }
  const data = await resp.json();
  if(!resp.ok || data.error) throw new Error(data.error || "Scan failed");
  return data; // { bill_no, description, amount }
}

async function scanPurchaseBill(file){
  if(!file) return;
  toast("Scanning bill — this can take a few seconds...");
  state.loading = true; render();
  try{
    const aiResult = await tryAiScanBill(file);
    console.log("AI scan result:", aiResult);
    if(aiResult.amount !== null && aiResult.amount !== undefined) state.purchaseFormDraft.amount = String(aiResult.amount);
    if(aiResult.has_vat !== undefined) state.purchaseFormDraft.hasVat = !!aiResult.has_vat;
    if(aiResult.bill_no) state.purchaseFormDraft.billNo = aiResult.bill_no;
    if(aiResult.description && !state.purchaseFormDraft.itemDescription) state.purchaseFormDraft.itemDescription = aiResult.description;
    if(aiResult.date){
      const m = String(aiResult.date).match(/(\d{4})-(\d{2})-(\d{2})/);
      if(m){
        state.purchaseFormDraft.purchaseDate = `${m[1]}-${m[2]}-${m[3]}`;
      }else{
        const parsed = new Date(aiResult.date);
        if(!isNaN(parsed.getTime())){
          state.purchaseFormDraft.purchaseDate = parsed.toISOString().slice(0,10);
        }
      }
    }
    handlePurchasePhotoFile(file);
    toast("Scanned with AI — please double-check the details before saving.");
  }catch(e){
    console.error("Bill scan error:", e);
    toast("Scan error: " + (e && e.message ? e.message : "unknown"));
  }
  state.loading = false;
  render();
}

async function savePurchase(){
  const f = state.purchaseFormDraft;
  if(!f.itemDescription.trim()){ toast("Describe what was purchased."); return; }
  if(!f.amount || Number(f.amount) <= 0){ toast("Enter a valid amount."); return; }

  const amountNum = Number(f.amount);
  const vatAmt = f.hasVat ? Math.round(amountNum * 0.15 * 100) / 100 : 0;
  const total = Math.round((amountNum + vatAmt) * 100) / 100;

  const payload = {
    purchase_date: f.purchaseDate || new Date().toISOString().slice(0,10),
    category: f.category || null,
    item_description: f.itemDescription.trim(),
    project_id: f.projectId || null,
    bill_no: f.billNo || null,
    vendor_name: f.vendorName || null,
    amount: amountNum,
    has_vat: !!f.hasVat,
    vat_amount: vatAmt,
    total_amount: total,
    payment_method: f.paymentMethod || null,
    receipt_photo: f.receiptPhoto || null,
    notes: f.notes || null
  };

  state.loading = true; render();
  let error;
  if(state.editingPurchaseId){
    ({ error } = await sb.from("ts_purchases").update(payload).eq("id", state.editingPurchaseId));
  }else{
    ({ error } = await sb.from("ts_purchases").insert({ ...payload, supervisor_id: state.user.id, status: "draft" }));
  }
  state.loading = false;
  if(error) console.error("Purchase save error:", error);
  toast(error ? "Error: " + (error.message || "unknown") : (state.editingPurchaseId ? "Item updated." : "Saved."));
  if(!error){
    state.purchaseFormDraft = { purchaseDate: "", category: "", itemDescription: "", projectId: "", billNo: "", vendorName: "", amount: "", hasVat: true, paymentMethod: "", notes: "", receiptPhoto: "" };
    state.editingPurchaseId = null;
  }
  await loadMyPurchases();
  render();
}

async function buildPurchasesPdf(items, filename, titleText){
  if(!items.length){ toast("No purchases to export."); return; }
  state.loading = true; render();
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "a4" });
    if(typeof doc.autoTable !== "function"){
      toast("PDF table library not loaded yet — please wait a moment and try again.");
      state.loading = false; render();
      return;
    }
    drawLetterhead(doc, "");

    doc.setFont("helvetica","bold"); doc.setFontSize(15); doc.setTextColor(15,53,86);
    doc.text(titleText, 40, 76);

    const body = items.map((p, i) => [
      i+1, formatDateDMY(p.purchase_date), p.item_description, p.ts_projects?.name || "-", p.bill_no || "-",
      Number(p.amount).toFixed(2), Number(p.vat_amount).toFixed(2), Number(p.total_amount).toFixed(2)
    ]);
    const totalAmount = items.reduce((s,p)=>s+(Number(p.amount)||0),0);
    const totalVat = items.reduce((s,p)=>s+(Number(p.vat_amount)||0),0);
    const totalAll = items.reduce((s,p)=>s+(Number(p.total_amount)||0),0);
    body.push(["", "", "", "", "TOTAL", totalAmount.toFixed(2), totalVat.toFixed(2), totalAll.toFixed(2)]);

    doc.autoTable({
      startY: 92,
      head: [["No.","Date","Description","Project","Bill No","Amount","VAT","Total"]],
      body: body,
      styles: { fontSize: 8.5, cellPadding: 4 },
      headStyles: { fillColor: [27,90,150], textColor: 255, fontStyle: "bold" },
      alternateRowStyles: { fillColor: [243,248,253] },
      columnStyles: {
        0: { cellWidth: 24, halign: "center" },
        5: { halign: "right" }, 6: { halign: "right" }, 7: { halign: "right", fontStyle: "bold" }
      },
      didParseCell: (data) => {
        if(data.row.index === body.length - 1 && data.section === "body"){
          data.cell.styles.fontStyle = "bold";
          data.cell.styles.fillColor = [240, 199, 102];
        }
      }
    });

    stampFooters(doc);
    doc.save(filename);
    toast("PDF downloaded.");
  }catch(e){
    console.error("Purchases PDF error:", e);
    toast("PDF error: " + (e && e.message ? e.message : "unknown"));
  }
  state.loading = false;
  render();
}

async function openHrTimesheetReview(employeeId){
  const sub = state.hrApproved.find(s => s.employee_id === employeeId);
  if(!sub) return;
  state.loading = true; render();
  const [hy, hm] = state.hrMonth.split("-").map(Number);
  const nd = new Date(hy, hm, 0).getDate();
  const start = fmtDate(hy, hm-1, 1), end = fmtDate(hy, hm-1, nd);
  const { data: entryRows } = await sb.from("ts_timesheet_entries").select("*")
    .eq("employee_id", employeeId).gte("entry_date", start).lte("entry_date", end);
  const entries = {};
  for(let day=1; day<=nd; day++){
    const dstr = fmtDate(hy, hm-1, day);
    const existing = (entryRows||[]).find(r=>r.entry_date===dstr);
    entries[dstr] = existing
      ? { status: existing.status, overtime_hours: existing.overtime_hours, project_id: existing.project_id || "" }
      : { status: isFriday(hy,hm-1,day) ? "Friday" : "Present", overtime_hours: 0, project_id: "" };

  state.hrSelectedEmployee = sub.ts_employees ? { ...sub.ts_employees, id: employeeId } : { id: employeeId };
  state.hrTimesheetEntries = entries;
  state.hrTimesheetSubmission = sub;
  state.loading = false;
  state.view = "hr-timesheet-review";
  render();
}

  toast((e1 || e2) ? "Could not save. Try again." : "Saved — sent back to the supervisor for re-approval.");
  if(!e1 && !e2){
    state.view = "hr";
    await loadHrMonth();
  }
  render();
}

async function deleteTimesheetSubmission(employeeId){
  const emp = state.hrApproved.find(s => s.employee_id === employeeId);

  if(!confirm(`Permanently delete ${name}'s timesheet for ${monthLabel(new Date(state.hrMonth + "-01"))}? This cannot be undone.`)) return;
  state.loading = true; render();
  const [hy, hm] = state.hrMonth.split("-").map(Number);
  const lastDay = new Date(hy, hm, 0).getDate();
  const startD = fmtDate(hy, hm-1, 1), endD = fmtDate(hy, hm-1, lastDay);
  const [{ error: e1 }, { error: e2 }] = await Promise.all([
    sb.from("ts_timesheet_submissions").delete().eq("employee_id", employeeId).eq("month", state.hrMonth),
    sb.from("ts_timesheet_entries").delete().eq("employee_id", employeeId)
      .gte("entry_date", startD).lte("entry_date", endD)
  ]);

      },

          data.cell.styles.fillColor = [253, 228, 228];
          data.cell.styles.textColor = [180, 40, 40];
          data.cell.styles.fontStyle = "bold";
        }

        margin: { left: 40, right: 40 },

        pageBreak: "avoid"
      });

    }

    y2 += 14;

    const sub = state.submission;

    const statusText = !sub ? "Status: Draft — not yet submitted"
      : sub.status === "approved" ? (selfSubmitted ? "Self-submitted (supervisor/HR — no review required):" : "Approved & signed by supervisor:")
      : sub.status === "submitted" ? "Status: Submitted — awaiting supervisor approval"
      : sub.status === "rejected" ? "Status: Sent back for changes"

    console.error("PDF generation error:", e);
    toast("PDF error: " + (e && e.message ? e.message : "unknown"));
  }
  state.loading = false;
  render();
}

async function downloadWorkbook(wb, filename){
  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 4000);
}

async function generateWpsPayroll(payrollGroup){
  const fileNumInput = prompt("WPS file number for today (e.g. 1, 2, 3...):", "1");
  if(fileNumInput === null) return;
  const fileNum = parseInt(fileNumInput, 10) || 1;

  state.loading = true; render();
  try{
    const { data: settings, error: setErr } = await sb.from("ts_payroll_settings")
      .select("*").eq("payroll_group", payrollGroup).maybeSingle();
    if(setErr) throw setErr;
    if(!settings || !settings.sending_bank_code || !settings.company_account_number){
      toast(payrollGroup === "AL_FALAK" ? "Al Falak's bank details haven't been set up yet." : "Payroll bank details aren't set up yet.");
      state.loading = false; render();
      return;
    }

    if(!state.hrmSupervisorId){
      const { data: mohammed } = await sb.from("ts_employees").select("id").eq("iqama_number", "1091504728").maybeSingle();
      state.hrmSupervisorId = mohammed ? mohammed.id : null;
    }

    const { data: allEmployees, error: empErr } = await sb.from("ts_employees")
      .select("*").in("role", ["employee","supervisor"]).eq("active", true).order("name");
    if(empErr) throw empErr;

    const inScopeEmployees = (allEmployees || []).filter(e => {
      const isSaudiTeam = state.hrmSupervisorId && (e.id === state.hrmSupervisorId || e.supervisor_id === state.hrmSupervisorId);
      if(payrollGroup === "AL_FALAK") return e.salary_group === "Al falak";
      return !isSaudiTeam ? e.salary_group !== "Al falak" : true; // PI_SAUDI: everyone not Al falak (Saudi team + PI)
    });
    // Saudi team first, then everyone else — matching the source file's layout
    inScopeEmployees.sort((a, b) => {
      const aSaudi = state.hrmSupervisorId && (a.id === state.hrmSupervisorId || a.supervisor_id === state.hrmSupervisorId);
      const bSaudi = state.hrmSupervisorId && (b.id === state.hrmSupervisorId || b.supervisor_id === state.hrmSupervisorId);
      if(aSaudi !== bSaudi) return aSaudi ? -1 : 1;
      return (a.name||"").localeCompare(b.name||"");
    });

    const [y, m] = state.hrMonth.split("-").map(Number);
    const nd = new Date(y, m, 0).getDate();
    const start = fmtDate(y, m-1, 1), end = fmtDate(y, m-1, nd);
    const monthDesc = `Salary ${monthLabel(new Date(y, m-1, 1))}`;

    const rows = [];
    const skipped = [];
    for(const emp of inScopeEmployees){
      if(!emp.iban || !emp.bank_code){ skipped.push(emp.name); continue; }
      const wpsBasic = Math.round(Number(emp.wps_basic) || 0), wpsHousing = Math.round(Number(emp.wps_housing) || 0), wpsOther = Math.round(Number(emp.wps_other) || 0);
      const isSaudiTeam = state.hrmSupervisorId && (emp.id === state.hrmSupervisorId || emp.supervisor_id === state.hrmSupervisorId);

      let transferAmount, deduction;
      if(isSaudiTeam){
        // Saudi team pay is fixed monthly, not attendance-based — no automatic deduction.
        transferAmount = wpsBasic + wpsHousing + wpsOther;
        deduction = 0;
      }else{
        const { data: entryRows } = await sb.from("ts_timesheet_entries").select("*")
          .eq("employee_id", emp.id).gte("entry_date", start).lte("entry_date", end);
        let present = 0, ot = 0, absent = 0;
        (entryRows || []).forEach(r => {
          if(r.status === "Present"){ present++; }
          else if(r.status === "Absent"){ absent++; }
          ot += Number(r.overtime_hours) || 0; // OT counts on any day, matching employee timesheet totals
        });
        const basicSalary = Number(emp.basic_salary) || 0;
        const otAmt = basicSalary/208*ot*1.25;
        const salary = basicSalary + otAmt;
        const absAmt = basicSalary/26*absent;
        const netPay = salary - absAmt;
        const gosiFixed = Number(emp.gosi_amount) > 0 ? Number(emp.gosi_amount) : basicSalary;
        transferAmount = Math.round(Math.min(gosiFixed, netPay));
        deduction = Math.max(Math.round((wpsBasic + wpsHousing + wpsOther) - transferAmount), 0);
      }

      rows.push([
        "D", transferAmount, emp.iban, (emp.name||"").toUpperCase(), emp.bank_code, monthDesc,
        wpsBasic, wpsHousing, wpsOther, deduction, emp.iqama_number, ""
      ]);
    }

    if(!rows.length){
      toast("No employees with IBAN/bank details set up for this group.");
      state.loading = false; render();
      return;
    }

    const today = new Date();
    const dd = String(today.getDate()).padStart(2,"0"), mm = String(today.getMonth()+1).padStart(2,"0"), yyyy = today.getFullYear();
    const valueDate = new Date(today); valueDate.setDate(valueDate.getDate()+1);
    const vdd = String(valueDate.getDate()).padStart(2,"0"), vmm = String(valueDate.getMonth()+1).padStart(2,"0"), vyyyy = valueDate.getFullYear();

    const headerRow = [
      "H", settings.sending_bank_code, settings.code_2330, "N",
      `${dd}${mm}${yyyy}.${String(fileNum).padStart(3,"0")}`,
      settings.company_account_number, "SAR", `${vdd}${vmm}${vyyyy}`,
      settings.code_92088, `${dd}${mm}${yyyy}`, settings.cr_number, monthDesc
    ];

    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet("Sheet2");
    ws.addRow(headerRow);
    rows.forEach(r => ws.addRow(r));

    // Exact column widths and cell alignment matching the bank's reference WPS file
    ws.columns = [
      { width: 7.14 },   // A - record type
      { width: 9.43 },   // B - amount
      { width: 26.0 },   // C - IBAN
      { width: 44.86 },  // D - name
      { width: 14.71 },  // E - bank code
      { width: 20.71 },  // F - description
      { width: 10.57 },  // G - basic
      { width: 8.43 },   // H - housing
      { width: 10.29 },  // I - other
      { width: 10.86 },  // J - deduction
      { width: 14.43 },  // K - iqama
      { width: 20.0 }    // L - blank
    ];
    const centerCols = [2, 5, 7, 8, 9, 10]; // B, E, G, H, I, J
    ws.eachRow((row, rowNum) => {
      if(rowNum === 1) return; // header row keeps default alignment, matching the reference file
      centerCols.forEach(colNum => {
        row.getCell(colNum).alignment = { horizontal: "center" };
      });
    });

    const filename = `WPY${dd}${mm}${yyyy}${String(fileNum).padStart(2,"0")}.xlsx`;
    await downloadWorkbook(wb, filename);

    if(skipped.length){
      toast(`Downloaded. Skipped ${skipped.length} without IBAN/bank: ${skipped.slice(0,3).join(", ")}${skipped.length>3?"...":""}`);
    }else{
      toast("WPS payroll file downloaded.");
    }
  }catch(e){
    console.error("WPS payroll error:", e);
    toast("WPS payroll error: " + (e && e.message ? e.message : "unknown"));
  }
  state.loading = false;
  render();
}

// Fixed monthly OTHR allowances (income column) for specific employees.
// Match key = lowercase substring checked against the employee's full name.
// To add/remove someone, edit this list — amount goes in OTHR, note becomes the cell comment.
const SALARY_OTHR_ALLOWANCES = [
  { match: "iqbal hussain", amount: 300, note: "Driving" },
  { match: "madhavadas",    amount: 400, note: "Driving + Phone" },
  { match: "vinesh",        amount: 300, note: "Driving" },
  { match: "dipindas devadas", amount: 300, note: "Driving" }
];
function getOthrAllowance(empName){
  const n = (empName || "").toLowerCase().trim();
  return SALARY_OTHR_ALLOWANCES.find(a => n.includes(a.match)) || null;
}

async function generateSalarySheet(){
  const shortName = (n) => (n || "").trim().split(/\s+/).slice(0, 2).join(" ");
  state.loading = true; render();
  try{
    const [y, m] = state.hrMonth.split("-").map(Number);
    const nd = new Date(y, m, 0).getDate();
    const start = fmtDate(y, m-1, 1), end = fmtDate(y, m-1, nd);

    // Show every active employee, but track which ones have a fully approved
    // timesheet for this month so those rows can be highlighted.
    const { data: employees, error: empErr } = await sb.from("ts_employees")
      .select("*").in("role", ["employee","supervisor"]).eq("active", true).order("name");
    if(empErr) throw empErr;

    const { data: approvedSubs, error: subErr } = await sb.from("ts_timesheet_submissions")
      .select("employee_id").eq("month", state.hrMonth).eq("status", "approved");
    if(subErr) throw subErr;
    const approvedIds = new Set((approvedSubs || []).map(s => s.employee_id));

    if(!state.hrmSupervisorId){
      const { data: mohammed } = await sb.from("ts_employees").select("id").eq("iqama_number", "1091504728").maybeSingle();
      state.hrmSupervisorId = mohammed ? mohammed.id : null;
    }

    const records = [];
    for(const emp of (employees || [])){
      const { data: entryRows } = await sb.from("ts_timesheet_entries").select("*")
        .eq("employee_id", emp.id).gte("entry_date", start).lte("entry_date", end);
      let present = 0, ot = 0, absent = 0;
      const projectDays = {};
      (entryRows || []).forEach(r => {
        ot += Number(r.overtime_hours) || 0; // OT counts on any day, matching employee timesheet totals
        if(r.status === "Present"){
          present++;
          if(r.project_id){
            const pname = projectName(r.project_id) || "";
            if(pname) projectDays[pname] = (projectDays[pname] || 0) + 1;
          }
        }else if(r.status === "Absent"){
          absent++; // Sick days are intentionally NOT counted here — no deduction for sick leave
        }
      });
      const projectLabel = Object.keys(projectDays).join("/");
      records.push({ emp, present, ot, absent, projectLabel, isApproved: approvedIds.has(emp.id) });
    }

    const groups = { "PI": [], "Saudi": [], "Al falak": [] };
    records.forEach(r => {
      const isSaudiTeam = state.hrmSupervisorId && (r.emp.id === state.hrmSupervisorId || r.emp.supervisor_id === state.hrmSupervisorId);
      const g = isSaudiTeam ? "Saudi" : (r.emp.salary_group === "Al falak" ? "Al falak" : "PI");
      groups[g].push(r);
    });

    if(!records.length){
      toast("No active employees found to include.");
      state.loading = false; render();
      return;
    }

    const wb = new ExcelJS.Workbook();
    const monthTitle = monthLabel(new Date(y, m-1, 1)).toUpperCase();

    const NAVY = "FF0F3556", WHITE = "FFFFFFFF", GOLD = "FFF0C766";
    const INCOME_HEAD = "FF1B7A6B", INCOME_TINT = "FFEAF6F3";     // teal — income group
    const DEDUCT_HEAD = "FFB0521C", DEDUCT_TINT = "FFFCEFE4";     // amber — deduction group
    const NEUTRAL_HEAD = "FF1B5A96", NEUTRAL_TINT = "FFF3F8FD";   // navy-blue — identity/payout columns
    const APPROVED_GREEN = "FFDDF3E4", APPROVED_TEXT = "FF1C8A4E";
    const thinBorder = { style: "thin", color: { argb: "FFB9C6D6" } };
    const allBorders = { top: thinBorder, left: thinBorder, bottom: thinBorder, right: thinBorder };

    // Column groups: 1-4 identity, 5-10 income (incl. SALARY), 11-13 deduction, 14-16 payout
    const colGroup = (colNum) => {
      if(colNum >= 5 && colNum <= 10) return "income";
      if(colNum >= 11 && colNum <= 13) return "deduct";
      return "neutral";
    };
    const headColor = { income: INCOME_HEAD, deduct: DEDUCT_HEAD, neutral: NEUTRAL_HEAD };
    const tintColor = { income: INCOME_TINT, deduct: DEDUCT_TINT, neutral: NEUTRAL_TINT };

    const headers1 = ["NO","NAME","COMPANY","PROJECT","INCOME","","","","","SALARY","DEDUCTION","","","N.PAY","GOSI","BALANCE"];
    const headers2 = ["","","","","BASIC","DAYS","OT","AMT","OTHR","","ABS","AMT","OTH","","",""];
    const colWidths = [5,22,11,20,9,6,6,9,8,10,6,9,8,11,10,11];

    Object.entries(groups).forEach(([groupName, groupRecords]) => {
      if(!groupRecords.length) return;
      const ws = wb.addWorksheet(groupName, { views: [{ showGridLines: false }] });
      ws.columns = colWidths.map(w => ({ width: w }));

      // Title row
      ws.mergeCells(1, 1, 1, 16);
      const titleCell = ws.getCell(1, 1);
      const groupLabel = groupName === "Al falak" ? "AL FALAK" : groupName.toUpperCase();
      titleCell.value = `${groupLabel} SALARIES FOR THE MONTH OF ${monthTitle}`;
      titleCell.font = { bold: true, size: 15, color: { argb: WHITE }, name: "Calibri" };
      titleCell.alignment = { horizontal: "center", vertical: "middle" };
      titleCell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: NAVY } };
      ws.getRow(1).height = 30;

      // Header rows — colored by column group (identity / income / deduction / payout)
      const h1 = ws.getRow(2);
      h1.values = headers1;
      const h2 = ws.getRow(3);
      h2.values = headers2;
      [h1, h2].forEach(hr => {
        hr.eachCell({ includeEmpty: true }, (cell, colNum) => {
          cell.font = { bold: true, size: 9.5, color: { argb: WHITE } };
          cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: headColor[colGroup(colNum)] } };
          cell.alignment = { horizontal: "center", vertical: "middle", wrapText: true };
          cell.border = allBorders;
        });
        hr.height = 16;
      });
      ws.mergeCells(2, 5, 2, 9);   // INCOME
      ws.mergeCells(2, 11, 2, 13); // DEDUCTION
      ws.mergeCells(2, 1, 3, 1);   // NO
      ws.mergeCells(2, 2, 3, 2);   // NAME
      ws.mergeCells(2, 3, 3, 3);   // COMPANY
      ws.mergeCells(2, 4, 3, 4);   // PROJECT
      ws.mergeCells(2, 10, 3, 10); // SALARY
      ws.mergeCells(2, 14, 3, 14); // N.PAY
      ws.mergeCells(2, 15, 3, 15); // GOSI
      ws.mergeCells(2, 16, 3, 16); // BALANCE

      const firstDataRow = 4;
      groupRecords.forEach((r, i) => {
        const row = firstDataRow + i;
        const wr = ws.getRow(row);
        const allowance = getOthrAllowance(r.emp.name);
        wr.values = [
          i + 1,
          shortName(r.emp.name),
          groupName === "Al falak" ? "AL FALAK" : (groupName === "Saudi" ? "SAUDI" : "PI"),
          r.projectLabel,
          Math.round(Number(r.emp.basic_salary) || 0),
          r.present,
          r.ot,
          { formula: `ROUND(E${row}/208*G${row}*1.25,0)` },
          allowance ? allowance.amount : 0,
          { formula: `E${row}+H${row}+I${row}` },
          r.absent,
          { formula: `ROUND(E${row}/26*K${row},0)` },
          0,
          { formula: `J${row}-L${row}-M${row}` },
          { formula: `ROUND(MIN(${Math.round(Number(r.emp.gosi_amount) > 0 ? Number(r.emp.gosi_amount) : (Number(r.emp.basic_salary) || 0))},N${row}),0)` },
          { formula: `N${row}-O${row}` }
        ];
        if(allowance){
          wr.getCell(9).note = allowance.note; // OTHR column comment, e.g. "Driving" or "Driving + Phone"
        }
        wr.eachCell({ includeEmpty: true }, (cell, colNum) => {
          cell.border = allBorders;
          cell.alignment = { horizontal: colNum <= 4 ? "left" : "center", vertical: "middle" };
          if(colNum >= 5 && colNum !== 6 && colNum !== 7 && colNum !== 11){
            cell.numFmt = "#,##0";
          }
          if(r.isApproved){
            cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: APPROVED_GREEN } };
          }else{
            cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: tintColor[colGroup(colNum)] } };
          }
        });
        if(r.isApproved){
          wr.getCell(2).font = { bold: true, color: { argb: APPROVED_TEXT } }; // NAME in green when approved
        }
        wr.getCell(14).fill = { type: "pattern", pattern: "solid", fgColor: { argb: GOLD } };
        wr.getCell(14).font = { bold: true };
      });

      const lastDataRow = firstDataRow + groupRecords.length - 1;
      const totalRow = lastDataRow + 1;
      const tr = ws.getRow(totalRow);
      tr.values = [
        "TOTAL","","","","","","","","",
        { formula: `SUM(J${firstDataRow}:J${lastDataRow})` },
        "","","",
        { formula: `SUM(N${firstDataRow}:N${lastDataRow})` },
        { formula: `SUM(O${firstDataRow}:O${lastDataRow})` },
        { formula: `SUM(P${firstDataRow}:P${lastDataRow})` }
      ];
      tr.eachCell({ includeEmpty: true }, cell => {
        cell.font = { bold: true };
        cell.border = { top: { style: "double", color: { argb: NAVY } }, bottom: thinBorder, left: thinBorder, right: thinBorder };
        cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFEAF2FA" } };
        cell.numFmt = "#,##0";
      });
      ws.mergeCells(totalRow, 1, totalRow, 9);
      ws.getCell(totalRow, 1).alignment = { horizontal: "right" };

      ws.getColumn(2).alignment = { horizontal: "left" };
      ws.getColumn(4).alignment = { horizontal: "left" };
    });

    if(!wb.worksheets.length){
      toast("No active employees found to include.");
      state.loading = false; render();
      return;
    }

    await downloadWorkbook(wb, `Salary_Sheet_${state.hrMonth}_v2_${Date.now()}.xlsx`);
    toast("Salary sheet downloaded.");
  }catch(e){
    console.error("Salary sheet error:", e);
    toast("Salary sheet error: " + (e && e.message ? e.message : "unknown"));
  }
  state.loading = false;
  render();
}

async function buildCombinedPdf(included, titleText, filename){
  if(!included.length){ toast("No employees to include in this PDF."); return; }
  state.loading = true; render();
  try{
  const [y, m] = state.hrMonth.split("-").map(Number);
  const nd = new Date(y, m, 0).getDate();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4" });

  // ---- Pass 1: fetch every employee's data and compute the company-wide project summary ----
  const employeeData = [];
  const companyProjectDays = {}; // project name -> days worked, across everyone
  for(let i=0; i<included.length; i++){
    const sub = included[i];
    const emp = sub.ts_employees;
    const { data: entryRows } = await sb.from("ts_timesheet_entries").select("*")
      .eq("employee_id", sub.employee_id)
      .gte("entry_date", fmtDate(y, m-1, 1)).lte("entry_date", fmtDate(y, m-1, nd));
    const entries = {};
    for(let day=1; day<=nd; day++){
      const dstr = fmtDate(y, m-1, day);
      const ex = (entryRows||[]).find(r=>r.entry_date===dstr);
      entries[dstr] = ex ? {status:ex.status, overtime_hours:ex.overtime_hours, project_id: ex.project_id || ""} : {status: isFriday(y,m-1,day)?"Friday":"Absent", overtime_hours:0, project_id: ""};
    }
    const totals = computeTotals(entries);

    // per-employee project day breakdown
    const empProjectDays = {};
    Object.values(entries).forEach(v=>{
      if(v.status === "Present" && v.project_id){
        const pname = projectName(v.project_id) || "Unassigned";
        empProjectDays[pname] = (empProjectDays[pname] || 0) + 1;
        companyProjectDays[pname] = (companyProjectDays[pname] || 0) + 1;
      }
    });

    employeeData.push({ sub, emp, entries, totals, empProjectDays });
  }

  // ---- Cover page ----
  drawLetterhead(doc);
  doc.setFontSize(16); doc.setTextColor(15,53,86);
  doc.text(`${titleText} — ${monthLabel(new Date(y, m-1, 1))}`, 40, 78);
  doc.setFontSize(10); doc.setTextColor(120,120,120);
  doc.text(`Generated ${new Date().toLocaleString()}  •  ${included.length} approved employee(s)`, 40, 96);

  const OT_MULTIPLIER = 1.25;
  const rosterRows = employeeData.map(({ emp, totals }) => {
    const otAdjusted = totals.ot * OT_MULTIPLIER;
    const total = totals.regularHours + otAdjusted;
    return [
      emp?.name || "Employee",
      totals.regularHours.toFixed(1),
      totals.ot.toFixed(1),
      otAdjusted.toFixed(1),
      total.toFixed(1)
    ];
  });
  if(rosterRows.length){
    doc.setFontSize(12); doc.setTextColor(15,53,86);
    doc.text("Employee hours summary", 40, 124);
    doc.setFontSize(8); doc.setTextColor(120,120,120);
    doc.text("OT × 1.25 = OT Hrs × 1.25   •   Total Hrs = Reg. Hrs + (OT × 1.25)", 40, 136);
    doc.autoTable({
      startY: 144,
      head: [["Employee","Reg. Hrs","OT Hrs","OT × 1.25","Total Hrs"]],
      body: rosterRows,
      styles: { fontSize: 8.5, cellPadding: 3.5 },
      headStyles: { fillColor: [27,90,150] },
      theme: "grid",
      margin: { left: 40, right: 40 },
      columnStyles: { 0: { cellWidth: 210 }, 1: { cellWidth: 75 }, 2: { cellWidth: 75 }, 3: { cellWidth: 80 }, 4: { cellWidth: 75 } }
    });
  }

  // ---- Pass 2: one page per employee ----
  for(const { sub, emp, entries, totals, empProjectDays } of employeeData){
    doc.addPage();
    drawLetterhead(doc);
    doc.setFontSize(13); doc.setTextColor(15,53,86);
    doc.text(emp?.name || "Employee", 40, 68);
    doc.setFontSize(9); doc.setTextColor(90,90,90);
    doc.text(`No: ${emp?.employee_no || "-"}   Site: ${emp?.project_site || "-"}   Month: ${monthLabel(new Date(y,m-1,1))}`, 40, 82);

    const body = [];
    const fridayRows = new Set();
    for(let day=1; day<=nd; day++){
      const dstr = fmtDate(y, m-1, day);
      const v = entries[dstr];
      const statusLabel = v.status === "Present" ? "P" : v.status;
      if(v.status === "Friday") fridayRows.add(body.length);
      body.push([ String(day).padStart(2,"0"), dayNameFull(y,m-1,day), statusLabel, v.status==="Present" ? "8.0" : "0.0", (Number(v.overtime_hours)||0).toFixed(1), projectName(v.project_id) || "-" ]);
    }
    doc.autoTable({
      startY: 92,
      head: [["Date","Day","Status","Reg. Hrs","OT Hrs","Project"]],
      body,
      styles: { fontSize: 8, cellPadding: 2.2, minCellHeight: 0, lineColor: [190,205,220], lineWidth: 0.6 },
      headStyles: { fillColor: [27,90,150], textColor: [255,255,255], fontStyle: "bold", halign: "left" },
      alternateRowStyles: { fillColor: [248,250,252] },
      theme: "grid",
      margin: { left: 40, right: 40, top: 40, bottom: 10 },
      tableWidth: "wrap",
      columnStyles: {
        0: { cellWidth: 38 },
        1: { cellWidth: 80 },
        2: { cellWidth: 50 },
        3: { cellWidth: 62 },
        4: { cellWidth: 58 },
        5: { cellWidth: 227 }
      },
      pageBreak: "avoid",
      rowPageBreak: "avoid",
      didParseCell: (data) => {
        if(data.section === "body" && fridayRows.has(data.row.index)){
          data.cell.styles.fillColor = [253, 228, 228];
          data.cell.styles.textColor = [180, 40, 40];
          data.cell.styles.fontStyle = "bold";
        }
      }
    });

    let y2 = doc.lastAutoTable.finalY + 16;
    doc.setFontSize(9); doc.setTextColor(40,40,40);
    doc.text(`Present: ${totals.present}   Absent: ${totals.absent}   Sick: ${totals.sick}   Leave: ${totals.leave}   OT hrs: ${totals.ot.toFixed(1)}   Total hrs: ${totals.totalHours.toFixed(1)}`, 40, y2);

    const projectEntries = Object.entries(empProjectDays);
    if(projectEntries.length){
      y2 += 10;
      doc.setFontSize(9.5); doc.setTextColor(15,53,86); doc.setFont("helvetica", "bold");
      doc.text("Days worked by project", 40, y2 + 8);
      doc.setFont("helvetica", "normal");
      doc.autoTable({
        startY: y2 + 14,
        head: [["Project","Days worked"]],
        body: projectEntries.map(([pname, days]) => [pname, String(days)]),
        styles: { fontSize: 8, cellPadding: 2.2 },
        headStyles: { fillColor: [27,90,150] },
        theme: "grid",
        margin: { left: 40, right: 40 },
        columnStyles: { 0: { cellWidth: 300 }, 1: { cellWidth: 100 } },
        pageBreak: "avoid"
      });
      y2 = doc.lastAutoTable.finalY;
    }

    y2 += 14;
    doc.setFontSize(9); doc.setTextColor(90,90,90);
    const selfSubmitted = sub.approved_by === sub.employee_id;
    doc.text(selfSubmitted ? "Self-submitted (supervisor/HR — no review required):" : "Approved & signed by supervisor:", 40, y2);
    if(sub.signature_data){
      try{ doc.addImage(sub.signature_data, "PNG", 40, y2+8, 130, 45); }catch(e){}
    }
    doc.text(`Approved: ${sub.approved_at ? new Date(sub.approved_at).toLocaleString() : "-"}`, 200, y2+30);

    if(sub.remarks){
      let y3 = y2 + 55;
      doc.setFontSize(9); doc.setTextColor(90,90,90); doc.setFont("helvetica", "bold");
      doc.text("Remarks:", 40, y3);
      doc.setFont("helvetica", "normal");
      const remarkLines = doc.splitTextToSize(sub.remarks, 515);
      doc.text(remarkLines, 40, y3 + 12);
    }
  }

  stampFooters(doc);
  doc.save(filename);
  state.loading = false;
  toast("PDF downloaded.");
  render();
  }catch(e){
    state.loading = false;
    console.error("PDF generation error:", e);
    toast("PDF error: " + (e && e.message ? e.message : "unknown"));
    render();
  }
}

function render(){
  const root = document.getElementById("root");
  if(!checkConfig()) return;

  if(!state.user){ root.innerHTML = renderLogin(); return; }

  let header = renderHeader();
  let body = "";
  if(state.view === "employee") body = renderEmployeeView();
  else if(state.view === "supervisor") body = renderSupervisorList();
  else if(state.view === "supervisor-review") body = renderSupervisorReview();
  else if(state.view === "supervisor-signature") body = renderSignaturePad();
  else if(state.view === "hr") body = renderHrView();
  else if(state.view === "hr-projects") body = renderProjectsManager();
  else if(state.view === "leave-form") body = renderLeaveForm();
  else if(state.view === "supervisor-leave-list") body = renderSupervisorLeaveList();
  else if(state.view === "hr-leave-list") body = renderHrLeaveList();
  else if(state.view === "hr-timesheet-review") body = renderHrTimesheetReview();
  else if(state.view === "purchase-form") body = renderPurchaseForm();
  else if(state.view === "hr-purchases-list") body = renderHrPurchasesList();
  else if(state.view === "supervisor-leave-review") body = renderSupervisorLeaveReview();

  root.innerHTML = header + `<main>${body}</main>`;
  attachViewEvents();
  if(state.view === "supervisor-signature") initSigPad();
  if(state.view === "leave-form") initLeaveSigPad();
}

  const ar = isSaudiUser();

  let banner = "";
  if(subStatus==="submitted") banner = `<div class="status-banner status-submitted">${ar ? "⏳ تم الإرسال — بانتظار اعتماد المشرف" : "⏳ Submitted — waiting for supervisor approval"}</div>`;

  let rows = "";
  for(let day=1; day<=nd; day++){

    const v = state.entries[dstr] || { status: isFriday(y,m,day) ? "Friday" : "Present", overtime_hours: 0, project_id: "" };

      <div class="summary-item s-absent"><div class="n">${totals.absent}</div><div class="l">${ar ? "غائب" : "Absent"}</div></div>
      <div class="summary-item s-total"><div class="n">${totals.totalHours.toFixed(1)}</div><div class="l">${ar ? "إجمالي الساعات" : "Total Hrs"}</div></div>

    <div class="card" style="padding:8px 6px 4px;">
      <table class="grid">

        <thead><tr><th>${ar?"التاريخ":"Date"}</th><th>${ar?"الحالة":"Status"}</th><th>${ar?"المشروع":"Project"}</th><th>${ar?"إضافي":"OT"}</th></tr></thead>
        <tbody>${rows}</tbody>

    </div>

      <button class="btn btn-save-draft btn-sm" id="saveDraftBtn" style="flex:1;">${ar ? "💾 حفظ كمسودة" : "💾 Save draft"}</button>

}

function groupPurchasesByBatch(items){
  const groups = {};
  items.forEach(p => {
    const key = p.batch_id || `single-${p.id}`; // older records without a batch_id get their own group
    if(!groups[key]) groups[key] = { batchId: key, items: [], date: p.purchase_date, createdAt: p.updated_at || p.created_at, supervisorName: p.ts_employees?.name };
    groups[key].items.push(p);
    if(p.purchase_date > groups[key].date) groups[key].date = p.purchase_date;
  });
  return Object.values(groups)
    .map(g => ({ ...g, total: g.items.reduce((s,p)=>s+(Number(p.total_amount)||0),0) }))
    .sort((a,b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
}

function firstLastName(n){
  const parts = (n || "").trim().split(/\s+/);
  if(parts.length <= 2) return parts.join(" ");
  return `${parts[0]} ${parts[parts.length-1]}`;
}

  const grandTotal = items.reduce((s,p)=>s+(Number(p.total_amount)||0),0);

  // Group batches by supervisor, so each person's submissions sit in their own section
  const bySupervisor = {};
  batches.forEach(b => {
    const key = b.supervisorName || "Unknown";
    if(!bySupervisor[key]) bySupervisor[key] = [];
    bySupervisor[key].push(b);
  });

  const renderBatchButton = (b, i) => {
    const expanded = state.expandedPurchaseBatch === b.batchId;
    const itemRows = b.items.map(p => `
      <tr>
        <td style="font-size:9px;white-space:nowrap;">${formatDateDMY(p.purchase_date)}</td>
        <td style="font-size:9px;">${p.item_description}</td>
        <td style="font-size:9px;">${p.ts_projects?.name || "-"}</td>
        <td style="font-size:9px;">${p.bill_no || "-"}</td>
        <td style="font-size:9px;text-align:right;">${Number(p.amount).toFixed(2)}</td>
        <td style="font-size:9px;text-align:right;">${Number(p.vat_amount).toFixed(2)}</td>
        <td style="font-size:9px;text-align:right;font-weight:700;">${Number(p.total_amount).toFixed(2)}</td>
      </tr>`).join("");
    return `
    <div style="margin-top:8px;">
      <button class="btn btn-outline" data-toggle-sent-batch="${b.batchId}" style="text-align:left;display:flex;justify-content:space-between;align-items:center;border-color:var(--blue-light);color:var(--blue);">
        <span>${i+1}. ${b.total.toFixed(2)} SAR (${formatDateDMY(b.date)})</span>
        <span>${expanded ? "▲" : "▼"}</span>
      </button>
      ${expanded ? `
      <div class="card" style="margin-top:6px;padding:6px 4px 2px;overflow-x:auto;">
        <table class="grid" style="min-width:520px;">
          <thead><tr><th style="font-size:8px;">Date</th><th style="font-size:8px;">Description</th><th style="font-size:8px;">Project</th><th style="font-size:8px;">Bill No</th><th style="font-size:8px;">Amount</th><th style="font-size:8px;">VAT</th><th style="font-size:8px;">Total</th></tr></thead>
          <tbody>${itemRows}</tbody>
        </table>
        <button class="link-btn" data-delete-purchase-batch="${b.batchId}" data-batch-count="${b.items.length}" style="color:var(--absent) !important;margin:8px 0 4px;">🗑 Remove this submission</button>
      </div>` : ""}
    </div>`;
  };

  const supervisorSections = Object.entries(bySupervisor).map(([name, supBatches]) => {
    const supTotal = supBatches.reduce((s,b)=>s+b.total,0);
    return `
    <div class="card" style="margin-top:18px;background:linear-gradient(135deg,var(--navy),var(--blue));">
      <div style="font-size:13px;color:#fff;font-weight:800;">👤 ${firstLastName(name)}</div>
      <div style="font-size:11.5px;color:#DCEAFB;">${supBatches.length} submission${supBatches.length===1?"":"s"} • Total ${supTotal.toFixed(2)} SAR</div>
    </div>
    ${supBatches.map((b,i) => renderBatchButton(b,i)).join("")}`;
  }).join("");

  return `
    <button class="back-link-glow" id="backToHrBtn" style="margin-bottom:14px;border:none;cursor:pointer;">‹ Back</button>
    <div class="card">
      <h3>🧾 Purchases / Expenses</h3>
      <div class="meta">${items.length} item${items.length===1?"":"s"} across ${batches.length} submission${batches.length===1?"":"s"} • Total ${grandTotal.toFixed(2)} SAR</div>
    </div>
    ${supervisorSections || `<div class="empty-state"><div class="ic">🧾</div>Nothing submitted yet.</div>`}
    <button class="btn btn-outline" id="exportPurchasesExcelBtn" style="margin-top:14px;">📊 Export as Excel</button>
    <button class="btn btn-primary" id="exportPurchasesPdfBtn" style="margin-top:8px;background:linear-gradient(135deg,#0F3556,#1B5A96);">📄 Export as PDF (v2)</button>
  `;
}

/* ---------------- event wiring (delegated — bound once, survives every re-render) ---------------- */
function handleDelegatedClick(e){
  const el = (id)=> e.target.closest("#"+id);

  if(el("logoutBtn")){ logout(); return; }
  if(el("loginBtn")){ doLogin(document.getElementById("loginIqama").value); return; }
  if(el("installAppBtn")){ handleInstallClick(); return; }

  const navBtn = e.target.closest("[data-nav]");
  if(navBtn){
    const dir = navBtn.getAttribute("data-nav");
    state.monthDate = new Date(state.monthDate.getFullYear(), state.monthDate.getMonth() + (dir==="next"?1:-1), 1);
    if(state.view === "employee") loadEmployeeMonth();
    else if(state.view === "supervisor") loadSupervisorList();
    return;
  }

  if(el("saveDraftBtn")){ saveDraft(false); return; }
  if(el("submitBtn")){ submitForApproval(); return; }

  const empEl = e.target.closest("[data-emp]");
  if(empEl){
    const emp = state.supervisorEmployees.find(x=>x.id===empEl.getAttribute("data-emp"));
    if(emp) openEmployeeReview(emp);
    return;
  }

  if(el("mySelfTimesheetBtn")){ state.view = "employee"; loadEmployeeMonth(); return; }
  if(el("downloadMyPdfBtn")){ downloadMyTimesheetPdf(); return; }
  const hrTsOtBtnEarly = e.target.closest(".hr-ts-ot-btn");
  if(hrTsOtBtnEarly){
    const dstr = hrTsOtBtnEarly.getAttribute("data-date");
    const dir = hrTsOtBtnEarly.getAttribute("data-dir");
    const current = Number((state.hrTimesheetEntries[dstr] || {}).overtime_hours) || 0;
    setHrEntry(dstr, "overtime_hours", stepOtValue(current, dir));
    return;
  }
  const otBtn = e.target.closest(".ot-btn");
  if(otBtn && !otBtn.disabled){
    const dstr = otBtn.getAttribute("data-date");
    const dir = otBtn.getAttribute("data-dir");
    const current = Number((state.entries[dstr] || {}).overtime_hours) || 0;
    setEntry(dstr, "overtime_hours", stepOtValue(current, dir));
    return;
  }
  if(el("manageProjectsBtn")){ state.view = "hr-projects"; render(); return; }
  const deleteSubBtn = e.target.closest("[data-delete-sub]");
  if(deleteSubBtn){ deleteTimesheetSubmission(deleteSubBtn.getAttribute("data-delete-sub")); return; }
  if(el("backToHrBtn")){ state.view = "hr"; loadHrMonth(); return; }
  if(el("addProjectBtn")){ addProject(); return; }
  const deactivateBtn = e.target.closest("[data-deactivate-project]");
  if(deactivateBtn){ deactivateProject(deactivateBtn.getAttribute("data-deactivate-project")); return; }
  if(el("backToTeamBtn")){
    if(state.user.role === "hr"){ state.view = "hr"; loadHrMonth(); }
    else if(state.user.role === "supervisor"){ state.view = "supervisor"; loadSupervisorList(); }
    else { state.view = "employee"; loadEmployeeMonth(); }
    return;
  }
  if(el("backToListBtn")){ state.view = "supervisor"; loadSupervisorList(); return; }
  if(el("sigSettingsBtn")){ state.view = "supervisor-signature"; render(); return; }
  if(el("clearSigBtn")){ clearSigPad(); return; }
  if(el("saveSigBtn")){ saveSigPad(); return; }
  if(el("approveBtn")){ approveTimesheet(); return; }
  if(el("rejectBtn")){ rejectTimesheet(); return; }
  if(el("combinedPdfBtn")){ generateCombinedPdf(); return; }
  if(el("saudiPdfBtn")){ generateSaudiTimesheetPdf(); return; }
  if(el("saudiArabicPdfBtn")){ generateSaudiArabicPdf(); return; }
  if(el("openLeaveFormBtn")){ state.view = "leave-form"; loadMyLeaveRequests().then(render); return; }
  if(el("openSupervisorLeaveListBtn")){ state.view = "supervisor-leave-list"; loadSupervisorLeaveRequests().then(render); return; }
  if(el("openHrLeaveListBtn")){ state.view = "hr-leave-list"; loadHrLeaveRequests().then(render); return; }
  if(el("wpsPiSaudiBtn")){ generateWpsPayroll("PI_SAUDI"); return; }
  if(el("wpsAlFalakBtn")){ generateWpsPayroll("AL_FALAK"); return; }
  if(el("openPurchaseFormBtn")){ state.view = "purchase-form"; loadMyPurchases().then(render); return; }
  if(el("purchasePhotoBtn")){ document.getElementById("purchasePhotoInput")?.click(); return; }
  if(el("scanBillBtn")){ document.getElementById("scanBillInput")?.click(); return; }
  if(el("savePurchaseBtn")){ savePurchase(); return; }
  if(el("submitAllPurchasesBtn")){ submitAllDraftsToHr(); return; }
  const deletePurchaseDraftEl = e.target.closest("[data-delete-purchase-draft]");
  if(deletePurchaseDraftEl){ deletePurchaseDraft(deletePurchaseDraftEl.getAttribute("data-delete-purchase-draft")); return; }
  const editPurchaseDraftEl = e.target.closest("[data-edit-purchase-draft]");
  if(editPurchaseDraftEl){ startEditPurchaseDraft(editPurchaseDraftEl.getAttribute("data-edit-purchase-draft")); return; }
  if(el("cancelEditPurchaseBtn")){ cancelEditPurchaseDraft(); return; }
  if(el("openHrPurchasesBtn")){ state.view = "hr-purchases-list"; loadHrPurchases().then(render); return; }
  const deletePurchaseEl = e.target.closest("[data-delete-purchase]");
  if(deletePurchaseEl){ deletePurchaseHr(deletePurchaseEl.getAttribute("data-delete-purchase")); return; }
  const toggleSentBatchEl = e.target.closest("[data-toggle-sent-batch]");
  if(toggleSentBatchEl){
    const batchId = toggleSentBatchEl.getAttribute("data-toggle-sent-batch");
    state.expandedPurchaseBatch = state.expandedPurchaseBatch === batchId ? null : batchId;
    render();
    return;
  }
  const deleteBatchEl = e.target.closest("[data-delete-purchase-batch]");
  if(deleteBatchEl){
    deletePurchaseBatchHr(deleteBatchEl.getAttribute("data-delete-purchase-batch"), Number(deleteBatchEl.getAttribute("data-batch-count")) || 0);
    return;
  }
  const downloadMyBatchEl = e.target.closest("[data-download-my-purchase-batch]");
  if(downloadMyBatchEl){ generateMyPurchaseBatchPdf(downloadMyBatchEl.getAttribute("data-download-my-purchase-batch")); return; }
  if(el("exportPurchasesExcelBtn")){ generatePurchasesExcel(); return; }
  if(el("exportPurchasesPdfBtn")){ generatePurchasesPdf(); return; }
  const reviewHrTsEl = e.target.closest("[data-review-hr-timesheet]");
  if(reviewHrTsEl){ openHrTimesheetReview(reviewHrTsEl.getAttribute("data-review-hr-timesheet")); return; }
  if(el("saveHrTimesheetBtn")){ saveHrTimesheetEdit(); return; }
  const reviewLeaveEl = e.target.closest("[data-review-leave]");
  if(reviewLeaveEl){
    const reqId = reviewLeaveEl.getAttribute("data-review-leave");
    state.selectedLeaveRequest = state.supervisorLeaveRequests.find(r=>r.id===reqId) || null;
    state.view = "supervisor-leave-review";
    render();
    return;
  }
  if(el("backToLeaveListBtn")){ state.view = "supervisor-leave-list"; render(); return; }
  const approveLeaveSupEl = e.target.closest("[data-approve-leave-sup]");
  if(approveLeaveSupEl){ approveLeaveSupervisor(approveLeaveSupEl.getAttribute("data-approve-leave-sup")); return; }
  const rejectLeaveSupEl = e.target.closest("[data-reject-leave-sup]");
  if(rejectLeaveSupEl){ rejectLeaveSupervisor(rejectLeaveSupEl.getAttribute("data-reject-leave-sup")); return; }
  const approveLeaveHrEl = e.target.closest("[data-approve-leave-hr]");
  if(approveLeaveHrEl){ approveLeaveHr(approveLeaveHrEl.getAttribute("data-approve-leave-hr")); return; }
  const rejectLeaveHrEl = e.target.closest("[data-reject-leave-hr]");
  if(rejectLeaveHrEl){ rejectLeaveHr(rejectLeaveHrEl.getAttribute("data-reject-leave-hr")); return; }
  const downloadLeaveEl = e.target.closest("[data-download-leave]");
  if(downloadLeaveEl){ generateLeavePdf(downloadLeaveEl.getAttribute("data-download-leave")); return; }
  const deleteLeaveHrEl = e.target.closest("[data-delete-leave-hr]");
  if(deleteLeaveHrEl){ deleteLeaveRequestHr(deleteLeaveHrEl.getAttribute("data-delete-leave-hr")); return; }
  const resendLeaveEl = e.target.closest("[data-resend-leave]");
  if(resendLeaveEl){ resendLeaveForEditing(resendLeaveEl.getAttribute("data-resend-leave")); return; }
  if(el("clearLeaveSigBtn")){ clearLeaveSigPad(); return; }
  if(el("leavePhotoBtn")){ document.getElementById("leavePhotoInput")?.click(); return; }
  if(el("submitLeaveBtn")){ submitLeaveRequest(); return; }
  const editLeaveEl = e.target.closest("[data-edit-leave]");
  if(editLeaveEl){ startEditLeaveRequest(editLeaveEl.getAttribute("data-edit-leave")); return; }
  if(el("cancelEditLeaveBtn")){ cancelEditLeaveRequest(); return; }
  if(el("salarySheetBtn")){ generateSalarySheet(); return; }
}

function handleDelegatedChange(e){
  if(e.target.classList.contains("hr-ts-status")){
    setHrEntry(e.target.getAttribute("data-date"), "status", e.target.value);
    return;
  }
  if(e.target.classList.contains("hr-ts-project")){
    setHrEntry(e.target.getAttribute("data-date"), "project_id", e.target.value);
    return;
  }
  if(e.target.classList.contains("project-select") && e.target.value === "__new__"){
    handleAddProjectFromEmployee(e.target.getAttribute("data-date"), e.target);
    return;
  }
  if(e.target.classList.contains("status-select")){
    const field = e.target.getAttribute("data-field") || "status";
    setEntry(e.target.getAttribute("data-date"), field, e.target.value);
    return;
  }
  if(e.target.id === "hrMonthInput"){
    state.hrMonth = e.target.value;
    loadHrMonth();
    return;
  }
  if(e.target.id === "newProjectNameInput"){
    state.newProjectName = e.target.value;
    return;
  }
  if(e.target.classList.contains("hr-include-check")){
    const empId = e.target.getAttribute("data-emp-id");
    if(e.target.checked) state.hrExcluded.delete(empId);
    else state.hrExcluded.add(empId);
    render();
    return;
  }
  if(e.target.id === "leaveLastVacation"){ state.leaveFormDraft.lastVacationDate = e.target.value; render(); return; }
  if(e.target.id === "leaveFirstDay"){ state.leaveFormDraft.firstDay = e.target.value; render(); return; }
  if(e.target.id === "leaveLastDay"){ state.leaveFormDraft.lastDay = e.target.value; render(); return; }
  if(e.target.name === "hasToolBox"){ state.leaveFormDraft.hasToolBox = e.target.value; return; }
  if(e.target.id === "purchaseDate"){ state.purchaseFormDraft.purchaseDate = e.target.value; return; }
  if(e.target.id === "purchaseCategory"){ state.purchaseFormDraft.category = e.target.value; return; }
  if(e.target.id === "purchaseProject"){ state.purchaseFormDraft.projectId = e.target.value; return; }
  if(e.target.id === "purchasePayment"){ state.purchaseFormDraft.paymentMethod = e.target.value; return; }
  if(e.target.id === "purchaseHasVat"){ state.purchaseFormDraft.hasVat = e.target.checked; render(); return; }
  if(e.target.id === "purchasePhotoInput"){ handlePurchasePhotoFile(e.target.files && e.target.files[0]); return; }
  if(e.target.id === "scanBillInput"){ scanPurchaseBill(e.target.files && e.target.files[0]); return; }
  if(e.target.id === "leavePhotoInput"){ handleLeavePhotoFile(e.target.files && e.target.files[0]); return; }
}

async function handleAddProjectFromEmployee(dstr, selectEl){
  const name = (prompt("New project name:") || "").trim();
  if(!name){ render(); return; } // re-render to reset the dropdown back to its previous value
  state.loading = true; render();
  const { data, error } = await sb.from("ts_projects")
    .upsert({ name, active: true }, { onConflict: "name" })
    .select()
    .maybeSingle();
  state.loading = false;
  if(error || !data){
    toast("Could not add project. Try again.");
    render(); return;
  }
  await loadProjects();
  setEntry(dstr, "project_id", data.id);
  toast(`"${name}" added and selected.`);
}

const OT_ALLOWED = [0, 0.5, 1, 1.5, 2];
for(let n=3; n<=50; n++) OT_ALLOWED.push(n);
function stepOtValue(current, dir){
  const idx = OT_ALLOWED.findIndex(v => Math.abs(v - current) < 0.001);
  if(dir === "up"){
    if(idx === -1) return OT_ALLOWED.find(v => v > current) ?? OT_ALLOWED[OT_ALLOWED.length-1];
    return OT_ALLOWED[Math.min(idx+1, OT_ALLOWED.length-1)];
  }else{
    if(idx === -1){
      const lower = [...OT_ALLOWED].reverse().find(v => v < current);
      return lower !== undefined ? lower : 0;
    }
    return OT_ALLOWED[Math.max(idx-1, 0)];
  }
}
function handleDelegatedInput(e){
  if(e.target.id === "remarksInput"){
    state.remarksDraft = e.target.value; // no re-render here, so the cursor position isn't lost while typing
  }
  if(e.target.id === "leaveMobile"){ state.leaveFormDraft.mobileNumber = e.target.value; }
  if(e.target.id === "leaveHomeMobile"){ state.leaveFormDraft.homeMobileNumber = e.target.value; }
  if(e.target.id === "leaveHandoverTo"){ state.leaveFormDraft.toolBoxHandoverTo = e.target.value; }
  if(e.target.id === "purchaseItem"){ state.purchaseFormDraft.itemDescription = e.target.value; }
  if(e.target.id === "purchaseVendor"){ state.purchaseFormDraft.vendorName = e.target.value; }
  if(e.target.id === "purchaseAmount"){
    state.purchaseFormDraft.amount = e.target.value;
    const amountNum = Number(e.target.value) || 0;
    const vatAmt = state.purchaseFormDraft.hasVat ? amountNum * 0.15 : 0;
    const vatEl = document.getElementById("purchaseVatDisplay");
    const totalEl = document.getElementById("purchaseTotalDisplay");
    if(vatEl) vatEl.textContent = vatAmt.toFixed(2) + " SAR";
    if(totalEl) totalEl.textContent = (amountNum + vatAmt).toFixed(2) + " SAR";
  }
  if(e.target.id === "purchaseBillNo"){ state.purchaseFormDraft.billNo = e.target.value; }
  if(e.target.id === "purchaseNotes"){ state.purchaseFormDraft.notes = e.target.value; }
}

function attachViewEvents(){
  // buttons/inputs are wired via document-level delegation set up once at boot (see init()),
  // so nothing to bind per render. Kept as a no-op entry point in case future per-render
  // wiring is needed.
}

/* ---------------- boot ---------------- */
window.addEventListener("error", function(e){
  console.error("Uncaught error:", e.error || e.message);
});
window.addEventListener("unhandledrejection", function(e){
  console.error("Unhandled rejection:", e.reason);
});

async function init(){
  window.__appBooted = true;
  setupSupabaseClient();
  if(!checkConfig()) return;
  document.addEventListener("click", handleDelegatedClick);
  document.addEventListener("change", handleDelegatedChange);
  document.addEventListener("input", handleDelegatedInput);
  if(state.user){
    const { data: mohammed } = await sb.from("ts_employees").select("id").eq("iqama_number", "1091504728").maybeSingle();
    state.hrmSupervisorId = mohammed ? mohammed.id : null;
    await loadProjects();
    state.view = state.user.role === "employee" ? "employee" : (state.user.role === "supervisor" ? "supervisor" : "hr");
    if(state.view === "employee") await loadEmployeeMonth();
    else if(state.view === "supervisor") await loadSupervisorList();
    else if(state.view === "hr") await loadHrMonth();
  }
  render();
}

// Wait for the async-loaded libraries (with CDN fallback) before booting the app.
if(window.__librariesAlreadyReady){
  init();
}else{
  document.addEventListener("librariesReady", init, { once: true });
}
</script>
